name: Construire l'APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Icone et ecran de demarrage (logo du concours)
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0A3D1C' --iconBackgroundColorDark '#0A3D1C' --splashBackgroundColor '#0A3D1C' --splashBackgroundColorDark '#0A3D1C'
      - run: npx cap sync android
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tirage-Mazamir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
