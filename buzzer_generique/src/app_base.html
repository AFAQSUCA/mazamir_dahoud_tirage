<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A3D1C">
<title>Buzzer du jury</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e53935'/%3E%3C/svg%3E">
<style>
:root{
  --bg1:#14602d;--bg2:#06280f;--acc:#E9C45A;--acc2:#F6D978;--accd:#B8861B;
  --txt:#fff;--sub:#d6ead9;--btn1:#ff8a80;--btn2:#e53935;--btn3:#b71c1c;--btn4:#7f0000;
  --panel:rgba(0,0,0,.30);--line:rgba(255,255,255,.22)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--txt);touch-action:manipulation}
body{background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0,var(--bg2) 100%);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:repeating-linear-gradient(45deg,var(--acc) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,var(--acc) 0 1px,transparent 1px 22px)}
#flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,40,40,.55),rgba(160,0,0,.75));opacity:0;pointer-events:none;transition:opacity .5s ease-out;z-index:5}
#flash.on{opacity:1;transition:none}
header{position:relative;display:flex;align-items:center;gap:10px 14px;padding:12px 18px;flex-wrap:wrap}
#logo{height:min(11vh,72px);max-width:22vw;object-fit:contain;display:none}
#logo.on{display:block}
#badge{height:min(11vh,64px);width:min(11vh,64px);border-radius:50%;display:none;align-items:center;justify-content:center;
  background:linear-gradient(var(--acc2),var(--accd));color:var(--bg2);font-weight:900;font-size:min(5vh,30px)}
#badge.on{display:flex}
header h1{margin:0;font-size:clamp(16px,3.2vw,30px);letter-spacing:.06em;color:var(--acc);line-height:1.1;text-transform:uppercase}
header h1 small{display:block;color:var(--txt);font-weight:500;letter-spacing:.02em;font-size:.62em;text-transform:none}
.sp{flex:1}
.tool{background:rgba(255,255,255,.10);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 14px;font-size:clamp(13px,2vw,17px);cursor:pointer;font-family:inherit}
.tool:active{background:rgba(255,255,255,.22)}
main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;min-height:0;padding:0 16px 12px}
#btn{width:min(72vw,60vh);height:min(72vw,60vh);border-radius:50%;border:0;cursor:pointer;position:relative;
  background:radial-gradient(circle at 36% 30%,var(--btn1) 0,var(--btn2) 30%,var(--btn3) 70%,var(--btn4) 100%);
  box-shadow:0 0 0 .9vmin var(--acc),0 0 0 1.5vmin rgba(0,0,0,.35),0 3vmin 6vmin rgba(0,0,0,.55),inset 0 -3vmin 6vmin rgba(0,0,0,.35),inset 0 2vmin 4vmin rgba(255,255,255,.25);
  color:#fff;font-family:inherit;font-weight:900;letter-spacing:.06em;font-size:min(9vw,9vh);text-shadow:0 .08em .2em rgba(0,0,0,.5);transition:transform .06s;padding:0 6%}
#btn small{display:block;font-size:.34em;font-weight:600;letter-spacing:.03em;opacity:.92;margin-top:.3em;line-height:1.2}
#btn:active,#btn.press{transform:scale(.955);box-shadow:0 0 0 .9vmin var(--acc),0 0 0 1.5vmin rgba(0,0,0,.35),0 1vmin 2vmin rgba(0,0,0,.55),inset 0 -1.5vmin 3vmin rgba(0,0,0,.45)}
#cpt{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 8px 6px 18px}
#cpt b{font-size:min(8vw,7vh);color:var(--acc2);min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
#cpt span{font-size:clamp(14px,2.6vw,22px)}
#cpt button{width:44px;height:44px;border-radius:12px;font-size:20px;padding:0}
#msg{height:1.4em;color:var(--sub);font-size:clamp(12px,2vw,16px)}
@media (max-width:640px){header{padding:10px 12px}header .sp{flex-basis:100%;height:0;order:5}header .tool{order:6;flex:1;padding:9px 6px}header h1{flex:1;min-width:0}}
@media (orientation:landscape){main{flex-direction:row;gap:5vw}#btn{width:min(62vh,50vw);height:min(62vh,50vw)}}

/* fenetre de reglages */
#reg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#reg.on{display:flex}
#boite{width:min(96vw,540px);max-height:94vh;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--bg1),var(--bg2));border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
#boite h2{margin:0;padding:16px 18px 6px;color:var(--acc);font-size:20px;letter-spacing:.04em}
#onglets{display:flex;gap:6px;padding:6px 14px 0;overflow-x:auto}
#onglets button{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--sub);font:600 15px inherit;font-family:inherit;padding:10px 10px;cursor:pointer}
#onglets button.on{color:var(--acc2);border-bottom-color:var(--acc)}
#corps{padding:14px 18px;overflow:auto;flex:1;min-height:0}
.pane{display:none}.pane.on{display:block}
label.f{display:block;margin:0 0 14px;font-size:14px;color:var(--sub)}
label.f input[type=text],label.f select{display:block;width:100%;margin-top:5px;padding:11px 12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--txt);font-family:inherit}
label.f input[type=text]:focus{outline:2px solid var(--acc)}
.logoLigne{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#apercuLogo{width:70px;height:70px;border-radius:14px;border:1px dashed var(--line);object-fit:contain;background:rgba(255,255,255,.08);flex:none}
.btnS{background:rgba(255,255,255,.12);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer;font-family:inherit}
.btnS:active{background:rgba(255,255,255,.25)}
.aide{font-size:12.5px;color:var(--sub);opacity:.85;margin:-6px 0 14px;line-height:1.35}
#themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:12px}
.th{border:2px solid transparent;border-radius:14px;padding:8px;cursor:pointer;background:rgba(0,0,0,.22);text-align:center;font-size:13px}
.th.sel{border-color:var(--acc);background:rgba(255,255,255,.1)}
.th i{display:block;height:38px;border-radius:9px;margin-bottom:6px;position:relative}
.th i b{position:absolute;right:6px;bottom:6px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.coul{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.coul label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
input[type=color]{width:46px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.snd{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.snd.sel{background:rgba(255,255,255,.12);border-color:var(--acc)}
.snd .pt{width:18px;height:18px;border-radius:50%;border:2px solid var(--acc);flex:none}
.snd.sel .pt{background:var(--acc)}
.snd .nom{flex:1;font-size:16px}.snd .nom small{display:block;opacity:.7;font-size:12px}
.vol{display:flex;align-items:center;gap:10px;margin:12px 4px 4px}.vol input{flex:1;accent-color:var(--acc)}
.rangee{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#ferme{margin:0 18px 16px;padding:13px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:linear-gradient(var(--acc2),var(--accd));color:#1a1a1a;cursor:pointer;font-family:inherit}
#toast{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none}
</style>
</head>
<body>
<div id="flash"></div>
<header>
  <img id="logo" alt="">
  <div id="badge"></div>
  <h1 id="titre"><span id="nomC"></span><small id="sousC"></small></h1>
  <div class="sp"></div>
  <button class="tool" id="son"></button>
  <button class="tool" id="raz"></button>
  <button class="tool" id="rg">⚙</button>
  <button class="tool" id="fs">⛶</button>
</header>
<main>
  <button id="btn"><span id="btnLabel"></span><small id="btnHint"></small></button>

    <div id="msg"></div>

</main>

<div id="reg"><div id="boite">
  <h2 id="regTitre"></h2>
  <div id="onglets"></div>
  <div id="corps">
    <div class="pane" data-p="concours">
      <label class="f"><span data-t="f_nom"></span><input type="text" id="i_nom" maxlength="60"></label>
      <label class="f"><span data-t="f_sous"></span><input type="text" id="i_sous" maxlength="60"></label>
      <div class="logoLigne">
        <img id="apercuLogo" alt="">
        <div>
          <button class="btnS" id="b_logo" data-t="b_logo"></button>
          <button class="btnS" id="b_nologo" data-t="b_nologo"></button>
          <input type="file" id="f_logo" accept="image/*" hidden>
        </div>
      </div>
      <label class="f"><span data-t="f_bouton"></span><input type="text" id="i_btn" maxlength="24"></label>
      <label class="f"><span data-t="f_indic"></span><input type="text" id="i_hint" maxlength="70"></label>
      <label class="f"><span data-t="f_cpt"></span><input type="text" id="i_cpt" maxlength="30"></label>
      <label class="f"><span data-t="f_lang"></span>
        <select id="i_lang"><option value="fr">Français</option><option value="en">English</option><option value="ar">العربية</option></select></label>
    </div>
    <div class="pane" data-p="theme">
      <p class="aide" data-t="a_theme"></p>
      <div id="themes"></div>
      <div class="coul" id="coulPerso">
        <label><span data-t="c_fond"></span><input type="color" id="c1"></label>
        <label><span data-t="c_accent"></span><input type="color" id="c2"></label>
      </div>
      <div class="coul">
        <label><span data-t="c_bouton"></span><input type="color" id="c3"></label>
        <button class="btnS" id="c3reset" data-t="c_defaut"></button>
      </div>
    </div>
    <div class="pane" data-p="sons">
      <div id="liste"></div>
      <div class="vol"><span>🔈</span><input type="range" id="vol" min="10" max="100" value="100"><span>🔊</span></div>
    </div>
    <div class="pane" data-p="donnees">
      <p class="aide" data-t="a_donnees"></p>
      <div class="rangee">
        <button class="btnS" id="b_exp" data-t="b_exp"></button>
        <button class="btnS" id="b_imp" data-t="b_imp"></button>
        <input type="file" id="f_imp" accept=".json,application/json" hidden>
      </div>
      <div class="rangee"><button class="btnS" id="b_reset" data-t="b_reset"></button></div>
    </div>
  </div>
  <button id="ferme"></button>
</div></div>
<div id="toast"></div>

  function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255; var mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, h=0, s=0, d=mx-mn;

    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",bg2);
  }

  /* couleurs d'un logo : couleur dominante (fond) et seconde couleur (accent) */
  function couleursDuLogo(img){
    var N=64, c=document.createElement("canvas"); c.width=N; c.height=N;
    var x=c.getContext("2d"); x.drawImage(img,0,0,N,N);
    var d; try{ d=x.getImageData(0,0,N,N).data; }catch(e){ return null; }
    var B=24, bk=[], i; for(i=0;i<B;i++) bk.push({w:0,h:0,s:0,l:0});
    for(i=0;i<d.length;i+=4){
      if(d[i+3]<140) continue;
      var q=rgb2hsl(d[i],d[i+1],d[i+2]);
      if(q[1]<.28||q[2]<.12||q[2]>.9) continue;
      var w=q[1]*(1-Math.abs(2*q[2]-1)), k=Math.floor(q[0]/(360/B))%B;
      bk[k].w+=w; bk[k].h+=q[0]*w; bk[k].s+=q[1]*w; bk[k].l+=q[2]*w;
    }
    var tot=0, best=-1; for(i=0;i<B;i++){ tot+=bk[i].w; if(best<0||bk[i].w>bk[best].w) best=i; }
    if(tot<3||bk[best].w<=0) return null;
    function moy(b){ return [b.h/b.w,b.s/b.w,b.l/b.w]; }
    var p=moy(bk[best]), sec=-1;
    for(i=0;i<B;i++){
      if(bk[i].w<bk[best].w*.12) continue;
      var h=bk[i].h/bk[i].w, dh=Math.abs(h-p[0]); dh=Math.min(dh,360-dh);
      if(dh>=45&&(sec<0||bk[i].w>bk[sec].w)) sec=i;
    }
    var fond=hsl2hex(p[0],p[1],p[2]), acc;
    if(sec>=0){ var s2=moy(bk[sec]); acc=hsl2hex(s2[0],s2[1],s2[2]); }
    else acc=hsl2hex(p[0]+((p[0]>20&&p[0]<70)?0:25),.85,.68);
    return [fond,acc];
  }

  /* ---------- configuration ---------- */
  var DEF={ nom:"", sous:"", logo:"", theme:"emeraude", c1:"#14602d", c2:"#E9C45A", c3:"#e53935", btn:"", hint:"", cpt:"", lang:"fr", son:"classique", vol:1, auto:null };
  var cfg={};
  function charger(){
    var o={}; try{ o=JSON.parse(lire("buzgen_cfg","{}"))||{}; }catch(e){ o={}; }
    cfg={}; for(var k in DEF) cfg[k]=(o[k]===undefined?DEF[k]:o[k]);
  }
  function sauver(){ var ok=ecrire("buzgen_cfg",JSON.stringify(cfg)); if(!ok) toast(L().save_ko); }
  function L(){ return T[cfg.lang]||T.fr; }
  function premier(){ return lire("buzgen_cfg",null)===null; }

  function couleursActives(){
    if(cfg.theme==="auto"&&cfg.auto) return cfg.auto;
    if(cfg.theme==="perso") return [cfg.c1,cfg.c2];
    if(PRESETS[cfg.theme]) return PRESETS[cfg.theme];
    return PRESETS.emeraude;
  }

  /* ---------- affichage principal ---------- */
  var n=0, muet=false;
  function initiales(s){ var m=(s||"").trim().split(/\s+/).filter(Boolean); return ((m[0]||"?").charAt(0)+(m[1]?m[1].charAt(0):"")).toUpperCase(); }
  function appliquer(){
    var t=L();
    document.documentElement.lang=cfg.lang; document.documentElement.dir=(cfg.lang==="ar"?"rtl":"ltr");
    var cs=couleursActives(); appliquerCouleurs(cs[0],cs[1],cfg.c3);
    $("nomC").textContent=cfg.nom||"";
    $("sousC").textContent=cfg.sous||t.sousDef;
    $("titre").style.display=(cfg.nom||cfg.sous||true)?"":"none";
    document.title=(cfg.nom?cfg.nom+" — ":"")+(cfg.sous||t.sousDef);
    var lg=$("logo"), bd=$("badge");
    if(cfg.logo){ lg.src=cfg.logo; lg.className="on"; bd.className=""; $("favicon").href=cfg.logo; }
    else { lg.removeAttribute("src"); lg.className=""; bd.textContent=initiales(cfg.nom); bd.className=cfg.nom?"on":"";
           $("favicon").href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e53935'/%3E%3C/svg%3E"; }
    $("btnLabel").textContent=cfg.btn||t.btnDef;
    $("btnHint").textContent=cfg.hint||t.hintDef;
    $("lblCpt").textContent=cfg.cpt||t.cptDef;
    $("son").textContent=muet?t.son_off:t.son_on;
    $("raz").textContent=t.raz;
    if(!$("msg").dataset.k) $("msg").textContent="";
  }

  /* ---------- audio ---------- */
  var ctx=null;
  function audio(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ctx&&ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function env(c,dest,t,pic,dur,att){ var g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(pic,t+(att||0.01)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); g.connect(dest); return g; }
  function tonalite(c,dest,t,type,f,pic,dur,f2){ var o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); o.connect(env(c,dest,t,pic,dur)); o.start(t); o.stop(t+dur+0.02); }
  function bruit(c,dest,t,dur,pic,freq,q){ var m=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,m,c.sampleRate), d=buf.getChannelData(0); for(var i=0;i<m;i++) d[i]=(Math.random()*2-1)*(1-i/m);
    var src=c.createBufferSource(); src.buffer=buf; var f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q; src.connect(f); f.connect(env(c,dest,t,pic,dur,0.002)); src.start(t); }
  var SONS=[
    {id:"classique",jouer:function(c,d,t){ [0,0.34].forEach(function(k){ tonalite(c,d,t+k,"sawtooth",150,0.55,0.30); tonalite(c,d,t+k,"square",75,0.35,0.30); tonalite(c,d,t+k,"sawtooth",152,0.3,0.30); }); }},
    {id:"buzzer1",jouer:function(c,d,t){ tonalite(c,d,t,"sawtooth",140,0.6,0.7); tonalite(c,d,t,"square",70,0.4,0.7); }},
    {id:"bip",jouer:function(c,d,t){ tonalite(c,d,t,"sine",880,0.9,0.35); }},
    {id:"bipgrave",jouer:function(c,d,t){ tonalite(c,d,t,"square",200,0.5,0.45); tonalite(c,d,t,"sine",100,0.7,0.45); }},
    {id:"clic",jouer:function(c,d,t){ bruit(c,d,t,0.05,1.0,2500,1.2); tonalite(c,d,t,"square",1800,0.3,0.03); }},
    {id:"toc",jouer:function(c,d,t){ tonalite(c,d,t,"sine",900,1.0,0.14,350); bruit(c,d,t,0.03,0.5,1500,1); }},
    {id:"ding",jouer:function(c,d,t){ tonalite(c,d,t,"sine",1175,0.7,1.0); tonalite(c,d,t,"sine",2350,0.25,0.6); }},
    {id:"klaxon",jouer:function(c,d,t){ tonalite(c,d,t,"square",330,0.45,0.9); tonalite(c,d,t,"sawtooth",332,0.4,0.9); }}
  ];
  function jouerSon(id){
    var c=audio(); if(!c) return;
    var son=SONS.filter(function(x){ return x.id===id; })[0]||SONS[0];
    var master=c.createGain(); master.gain.value=(+cfg.vol||1)*2.5;
    var comp=c.createDynamicsCompressor(); master.connect(comp); comp.connect(c.destination);
    son.jouer(c,master,c.currentTime+0.01);
  }

  /* ---------- buzzer ---------- */
  var btn=$("btn"), flash=$("flash"), msg=$("msg"), reg=$("reg");
  function dire(txt){ msg.textContent=txt; msg.dataset.k=txt?"1":""; }
  function erreur(){
    if(!muet) jouerSon(cfg.son);
    n++; $("n").textContent=n;
    flash.classList.add("on"); void flash.offsetWidth; flash.classList.remove("on");
    btn.classList.add("press"); setTimeout(function(){ btn.classList.remove("press"); },120);
    if(navigator.vibrate){ try{ navigator.vibrate([180,80,180]); }catch(e){} }
    dire(L().err+n);
  }
  function raz(){ n=0; $("n").textContent=0; dire(L().razmsg); }
  btn.addEventListener("pointerdown",function(e){ e.preventDefault(); erreur(); });
  $("raz").addEventListener("click",raz);
  $("moins").addEventListener("click",function(){ if(n>0){ n--; $("n").textContent=n; dire(n?L().err+n:""); } });
  $("son").addEventListener("click",function(){ muet=!muet; appliquer(); if(!muet) jouerSon(cfg.son); });
  $("fs").addEventListener("click",function(){ var d=document.documentElement;
    if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); }
    else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } });
  document.addEventListener("keydown",function(e){
    if(e.repeat||reg.classList.contains("on")) return;
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); erreur(); }
    else if(e.key==="r"||e.key==="R"){ raz(); }
  });
  ["pointerdown","touchstart","keydown"].forEach(function(ev){ document.addEventListener(ev,audio,{once:true,passive:true}); });

  /* ---------- fenetre de reglages ---------- */
  var ONGLETS=["concours","theme","sons","donnees"], ongletCourant="concours", premierLancement=false;
  function toast(txt){ var t=$("toast"); t.textContent=txt; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(function(){ t.style.display="none"; },2600); }
  function textes(){
    var t=L(); var els=document.querySelectorAll("[data-t]");
    for(var i=0;i<els.length;i++){ var v=t[els[i].getAttribute("data-t")]; if(v!==undefined) els[i].textContent=v; }
    $("regTitre").textContent=premierLancement?t.titre0:t.titre;
    $("ferme").textContent=t.ferme;
    $("onglets").innerHTML="";
    ONGLETS.forEach(function(o){ var b=document.createElement("button"); b.textContent=t["o_"+o]; b.className=(o===ongletCourant?"on":"");
      b.addEventListener("click",function(){ ongletCourant=o; panneaux(); }); $("onglets").appendChild(b); });
  }
  function panneaux(){
    var ps=document.querySelectorAll(".pane"); for(var i=0;i<ps.length;i++) ps[i].classList.toggle("on",ps[i].getAttribute("data-p")===ongletCourant);
    var bs=$("onglets").children; for(var j=0;j<bs.length;j++) bs[j].classList.toggle("on",ONGLETS[j]===ongletCourant);
  }
  function listeThemes(){
    var t=L(), box=$("themes"); box.innerHTML="";
    function carte(id,nom,c1,c2,extra){
      var d=document.createElement("div"); d.className="th"+(cfg.theme===id?" sel":"");
      d.innerHTML='<i style="background:linear-gradient(135deg,'+c1+','+c2+')"><b style="background:'+c2+'"></b></i>'+nom;
      d.addEventListener("click",function(){ cfg.theme=id; sauver(); appliquer(); listeThemes(); majCouleurs(); });
      box.appendChild(d);
    }
    var a=cfg.auto||["#444","#999"];
    carte("auto",t.th_auto+(cfg.auto?"":" ·"),a[0],a[1]);
    Object.keys(PRESETS).forEach(function(k){ carte(k,t["th_"+k],PRESETS[k][0],PRESETS[k][1]); });
    carte("perso",t.th_perso,cfg.c1,cfg.c2);
  }
  function majCouleurs(){
    $("c1").value=cfg.c1; $("c2").value=cfg.c2; $("c3").value=cfg.c3;
    $("coulPerso").style.display=(cfg.theme==="perso"?"flex":"none");
  }
  function listeSons(){
    var t=L(), box=$("liste"); box.innerHTML="";
    SONS.forEach(function(sn){
      var nm=t.sons[sn.id]; var li=document.createElement("div"); li.className="snd"+(sn.id===cfg.son?" sel":"");
      li.innerHTML='<span class="pt"></span><span class="nom">'+nm[0]+'<small>'+nm[1]+'</small></span>';
      var b=document.createElement("button"); b.className="btnS"; b.textContent="▶";
      b.addEventListener("click",function(e){ e.stopPropagation(); jouerSon(sn.id); }); li.appendChild(b);
      li.addEventListener("click",function(){ cfg.son=sn.id; sauver(); listeSons(); jouerSon(cfg.son); });
      box.appendChild(li);
    });
  }
  function remplir(){
    $("i_nom").value=cfg.nom; $("i_sous").value=cfg.sous; $("i_btn").value=cfg.btn; $("i_hint").value=cfg.hint; $("i_cpt").value=cfg.cpt; $("i_lang").value=cfg.lang;
    $("i_nom").placeholder=""; $("i_sous").placeholder=L().sousDef; $("i_btn").placeholder=L().btnDef; $("i_hint").placeholder=L().hintDef; $("i_cpt").placeholder=L().cptDef;
    if(cfg.logo){ $("apercuLogo").src=cfg.logo; $("apercuLogo").style.visibility="visible"; } else { $("apercuLogo").removeAttribute("src"); $("apercuLogo").style.visibility="visible"; }
    $("vol").value=Math.round((+cfg.vol||1)*100);
    textes(); panneaux(); listeThemes(); majCouleurs(); listeSons();
  }
  function ouvrir(prem){ premierLancement=!!prem; ongletCourant="concours"; remplir(); reg.classList.add("on"); }
  function fermer(){
    reg.classList.remove("on"); premierLancement=false;
    ecrire("buzgen_cfg",JSON.stringify(cfg));   // marque la configuration comme faite
  }
  [["i_nom","nom"],["i_sous","sous"],["i_btn","btn"],["i_hint","hint"],["i_cpt","cpt"]].forEach(function(p){
    $(p[0]).addEventListener("input",function(){ cfg[p[1]]=this.value; sauver(); appliquer(); });
  });
  $("i_lang").addEventListener("change",function(){ cfg.lang=this.value; sauver(); appliquer(); remplir(); });
  $("c1").addEventListener("input",function(){ cfg.c1=this.value; cfg.theme="perso"; sauver(); appliquer(); listeThemes(); majCouleurs(); });
  $("c2").addEventListener("input",function(){ cfg.c2=this.value; cfg.theme="perso"; sauver(); appliquer(); listeThemes(); majCouleurs(); });
  $("c3").addEventListener("input",function(){ cfg.c3=this.value; sauver(); appliquer(); });
  $("c3reset").addEventListener("click",function(){ cfg.c3=DEF.c3; sauver(); appliquer(); majCouleurs(); });
  $("vol").addEventListener("input",function(){ cfg.vol=this.value/100; sauver(); });
  $("vol").addEventListener("change",function(){ jouerSon(cfg.son); });
  $("rg").addEventListener("click",function(){ ouvrir(false); });
  $("ferme").addEventListener("click",fermer);

  /* logo */
  $("b_logo").addEventListener("click",function(){ $("f_logo").click(); });
  $("b_nologo").addEventListener("click",function(){ cfg.logo=""; cfg.auto=null; if(cfg.theme==="auto") cfg.theme="emeraude"; sauver(); appliquer(); remplir(); });
  $("f_logo").addEventListener("change",function(){
    var f=this.files&&this.files[0]; this.value=""; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var M=480, r=Math.min(1,M/Math.max(im.width,im.height)), c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*r)); c.height=Math.max(1,Math.round(im.height*r));
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        var url; try{ url=c.toDataURL("image/png"); }catch(e){ toast(L().logo_ko); return; }
        cfg.logo=url; cfg.auto=couleursDuLogo(c);
        if(cfg.auto) cfg.theme="auto"; else if(cfg.theme==="auto") cfg.theme="emeraude";
        sauver(); appliquer(); remplir();
      };
      im.onerror=function(){ toast(L().logo_ko); };
      im.src=fr.result;
    };
    fr.onerror=function(){ toast(L().logo_ko); };
    fr.readAsDataURL(f);
  });

  /* export / import / reinitialisation */
  $("b_exp").addEventListener("click",function(){
    var blob=new Blob([JSON.stringify({buzzerGenerique:1,config:cfg},null,1)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="buzzer_"+((cfg.nom||"concours").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")||"concours")+".json";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); toast(L().exp_ok);
  });
  $("b_imp").addEventListener("click",function(){ $("f_imp").click(); });
  $("f_imp").addEventListener("change",function(){
    var f=this.files&&this.files[0]; this.value=""; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result); if(!o||!o.config) throw 0;
        for(var k in DEF) if(o.config[k]!==undefined) cfg[k]=o.config[k];
        sauver(); appliquer(); remplir(); toast(L().imp_ok);
      }catch(e){ toast(L().imp_ko); }
    };
    fr.readAsText(f);
  });
  $("b_reset").addEventListener("click",function(){
    if(!confirm(L().reset_q)) return;
    try{ localStorage.removeItem("buzgen_cfg"); }catch(e){}
    charger(); appliquer(); ouvrir(true);
  });

  /* ---------- demarrage ---------- */
  charger();
  var prem=premier();
  // langue du navigateur au tout premier lancement
  if(prem){ var nl=(navigator.language||"fr").slice(0,2); if(T[nl]) cfg.lang=nl; }
  appliquer();
  if(prem) ouvrir(true);
})();
</script>
