<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A3D1C">
<title>Buzzer du jury</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e53935'/%3E%3C/svg%3E">
<style>
:root{
  --bg1:#14602d;--bg2:#06280f;--acc:#E9C45A;--acc2:#F6D978;--accd:#B8861B;
  --txt:#fff;--sub:#d6ead9;--btn1:#ff8a80;--btn2:#e53935;--btn3:#b71c1c;--btn4:#7f0000;
  --panel:rgba(0,0,0,.30);--line:rgba(255,255,255,.22)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--txt);touch-action:manipulation}
body{background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0,var(--bg2) 100%);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:repeating-linear-gradient(45deg,var(--acc) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,var(--acc) 0 1px,transparent 1px 22px)}
#flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,40,40,.55),rgba(160,0,0,.75));opacity:0;pointer-events:none;transition:opacity .5s ease-out;z-index:5}
#flash.on{opacity:1;transition:none}
header{position:relative;display:flex;align-items:center;gap:10px 14px;padding:12px 18px;flex-wrap:wrap}
#logo{height:min(11vh,72px);max-width:22vw;object-fit:contain;display:none}
#logo.on{display:block}
#badge{height:min(11vh,64px);width:min(11vh,64px);border-radius:50%;display:none;align-items:center;justify-content:center;
  background:linear-gradient(var(--acc2),var(--accd));color:var(--bg2);font-weight:900;font-size:min(5vh,30px)}
#badge.on{display:flex}
header h1{margin:0;font-size:clamp(16px,3.2vw,30px);letter-spacing:.06em;color:var(--acc);line-height:1.1;text-transform:uppercase}
header h1 small{display:block;color:var(--txt);font-weight:500;letter-spacing:.02em;font-size:.62em;text-transform:none}
.sp{flex:1}
.tool{background:rgba(255,255,255,.10);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 14px;font-size:clamp(13px,2vw,17px);cursor:pointer;font-family:inherit}
.tool:active{background:rgba(255,255,255,.22)}
main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;min-height:0;padding:0 16px 12px}
#btn{width:min(72vw,60vh);height:min(72vw,60vh);border-radius:50%;border:0;cursor:pointer;position:relative;
  background:radial-gradient(circle at 36% 30%,var(--btn1) 0,var(--btn2) 30%,var(--btn3) 70%,var(--btn4) 100%);
  box-shadow:0 0 0 .9vmin var(--acc),0 0 0 1.5vmin rgba(0,0,0,.35),0 3vmin 6vmin rgba(0,0,0,.55),inset 0 -3vmin 6vmin rgba(0,0,0,.35),inset 0 2vmin 4vmin rgba(255,255,255,.25);
  color:#fff;font-family:inherit;font-weight:900;letter-spacing:.06em;font-size:min(9vw,9vh);text-shadow:0 .08em .2em rgba(0,0,0,.5);transition:transform .06s;padding:0 6%}
#btn small{display:block;font-size:.34em;font-weight:600;letter-spacing:.03em;opacity:.92;margin-top:.3em;line-height:1.2}
#btn:active,#btn.press{transform:scale(.955);box-shadow:0 0 0 .9vmin var(--acc),0 0 0 1.5vmin rgba(0,0,0,.35),0 1vmin 2vmin rgba(0,0,0,.55),inset 0 -1.5vmin 3vmin rgba(0,0,0,.45)}
#cpt{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 8px 6px 18px}
#cpt b{font-size:min(8vw,7vh);color:var(--acc2);min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
#cpt span{font-size:clamp(14px,2.6vw,22px)}
#cpt button{width:44px;height:44px;border-radius:12px;font-size:20px;padding:0}
#msg{height:1.4em;color:var(--sub);font-size:clamp(12px,2vw,16px)}
@media (max-width:640px){header{padding:10px 12px}header .sp{flex-basis:100%;height:0;order:5}header .tool{order:6;flex:1;padding:9px 6px}header h1{flex:1;min-width:0}}
@media (orientation:landscape){main{flex-direction:row;gap:5vw}#btn{width:min(62vh,50vw);height:min(62vh,50vw)}}

/* fenetre de reglages */
#reg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#reg.on{display:flex}
#boite{width:min(96vw,540px);max-height:94vh;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--bg1),var(--bg2));border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
#boite h2{margin:0;padding:16px 18px 6px;color:var(--acc);font-size:20px;letter-spacing:.04em}
#onglets{display:flex;gap:6px;padding:6px 14px 0;overflow-x:auto}
#onglets button{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--sub);font:600 15px inherit;font-family:inherit;padding:10px 10px;cursor:pointer}
#onglets button.on{color:var(--acc2);border-bottom-color:var(--acc)}
#corps{padding:14px 18px;overflow:auto;flex:1;min-height:0}
.pane{display:none}.pane.on{display:block}
label.f{display:block;margin:0 0 14px;font-size:14px;color:var(--sub)}
label.f input[type=text],label.f select{display:block;width:100%;margin-top:5px;padding:11px 12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--txt);font-family:inherit}
label.f input[type=text]:focus{outline:2px solid var(--acc)}
.logoLigne{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#apercuLogo{width:70px;height:70px;border-radius:14px;border:1px dashed var(--line);object-fit:contain;background:rgba(255,255,255,.08);flex:none}
.btnS{background:rgba(255,255,255,.12);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer;font-family:inherit}
.btnS:active{background:rgba(255,255,255,.25)}
.aide{font-size:12.5px;color:var(--sub);opacity:.85;margin:-6px 0 14px;line-height:1.35}
#themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:12px}
.th{border:2px solid transparent;border-radius:14px;padding:8px;cursor:pointer;background:rgba(0,0,0,.22);text-align:center;font-size:13px}
.th.sel{border-color:var(--acc);background:rgba(255,255,255,.1)}
.th i{display:block;height:38px;border-radius:9px;margin-bottom:6px;position:relative}
.th i b{position:absolute;right:6px;bottom:6px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.coul{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.coul label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
input[type=color]{width:46px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.snd{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.snd.sel{background:rgba(255,255,255,.12);border-color:var(--acc)}
.snd .pt{width:18px;height:18px;border-radius:50%;border:2px solid var(--acc);flex:none}
.snd.sel .pt{background:var(--acc)}
.snd .nom{flex:1;font-size:16px}.snd .nom small{display:block;opacity:.7;font-size:12px}
.vol{display:flex;align-items:center;gap:10px;margin:12px 4px 4px}.vol input{flex:1;accent-color:var(--acc)}
.rangee{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#ferme{margin:0 18px 16px;padding:13px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:linear-gradient(var(--acc2),var(--accd));color:#1a1a1a;cursor:pointer;font-family:inherit}

/* modes equipes */
#mainEq{position:relative;flex:1;display:none;flex-direction:column;gap:1.4vh;padding:0 16px 14px;min-height:0}
#mainEq.on{display:flex}
#eqBar{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
#eqStatus{font-size:clamp(20px,4.2vw,40px);font-weight:800;color:var(--acc2);padding:2px 22px;border-radius:999px;min-height:1.3em;transition:background .2s}
#eqInfo{font-size:clamp(12px,1.8vw,15px);color:var(--sub);word-break:break-all}
#eqZones{flex:1;min-height:0;display:grid;gap:2vmin;grid-template-columns:repeat(var(--cols,2),1fr);grid-auto-rows:1fr}
.zone{border:0;border-radius:3vmin;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;min-height:0;min-width:0;
  background:radial-gradient(circle at 36% 30%,var(--z1),var(--z) 62%,var(--z2));
  box-shadow:0 0 0 .7vmin rgba(255,255,255,.35),0 2vmin 4vmin rgba(0,0,0,.5),inset 0 -2vmin 4vmin rgba(0,0,0,.25),inset 0 1.5vmin 3vmin rgba(255,255,255,.25);transition:transform .06s,filter .2s,opacity .2s}
.zone:active{transform:scale(.97)}
.zone .zn{font-size:clamp(20px,5.5vw,64px);font-weight:900;text-shadow:0 .06em .18em rgba(0,0,0,.55);padding:0 .3em;text-align:center;line-height:1.05}
.zone .zs{font-size:clamp(18px,3.8vw,42px);font-weight:800;background:rgba(0,0,0,.3);padding:.05em .7em;border-radius:999px;font-variant-numeric:tabular-nums}
.zone.off{filter:grayscale(.8) brightness(.55);cursor:default}
.zone.out{filter:grayscale(1) brightness(.38);cursor:default}
.zone.lose{opacity:.4;cursor:default}
.zone.win{box-shadow:0 0 0 1vmin #fff,0 0 7vmin var(--z),inset 0 1.5vmin 3vmin rgba(255,255,255,.3);animation:gagne .7s ease-in-out infinite alternate}
@keyframes gagne{from{transform:scale(1)}to{transform:scale(1.025)}}
#mainEq.hote .zone,#mainEq.hote .zone:active{cursor:default;transform:none}
#eqScores{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 6px 4px 12px;font-size:clamp(13px,2vw,17px)}
.chip i{font-style:normal;font-weight:800;min-width:1.6em;text-align:center;color:var(--acc2);font-variant-numeric:tabular-nums}
.chip button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--txt);font-size:16px;cursor:pointer;padding:0}
#eqCtl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#eqCtl .tool{font-weight:700;padding:12px 18px;font-size:clamp(14px,2.2vw,19px)}
#eqCtl .tool[disabled]{opacity:.35;cursor:default}
#g_open{background:linear-gradient(var(--acc2),var(--accd));color:#1a1a1a;border:0}
#g_good{background:#2e7d32;border-color:#66bb6a}#g_bad{background:#c62828;border-color:#ef5350}
#join{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#join.on{display:flex}
#joinBox{width:min(94vw,440px);background:linear-gradient(160deg,var(--bg1),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center}
#joinBox h2{margin:0 0 14px;color:var(--acc);font-size:20px}
#joinBox button{display:block;width:100%;margin:8px 0;padding:16px;font-size:20px;font-weight:800;color:#fff;border:0;border-radius:14px;cursor:pointer;font-family:inherit;text-shadow:0 1px 3px rgba(0,0,0,.5)}
label.chk{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-size:14px;color:var(--sub)}
label.chk input{width:20px;height:20px;accent-color:var(--acc)}
.eqrow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.eqrow input[type=text]{flex:1;padding:10px 12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--txt);font-family:inherit}
.mode{display:block;padding:12px 14px;border-radius:14px;cursor:pointer;border:2px solid transparent;background:rgba(0,0,0,.2);margin-bottom:10px}
.mode.sel{border-color:var(--acc);background:rgba(255,255,255,.1)}
.mode b{display:block;font-size:16px}.mode small{display:block;margin-top:3px;color:var(--sub);font-size:13px;line-height:1.35}

#toast{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none}
</style>
</head>

<script>
/* Moteur de jeu "premier a buzzer a la main" - partage par la page (mode un seul ecran) et par le serveur. */
(function (root, f) { if (typeof module === "object" && module.exports) module.exports = f(); else root.Moteur = f(); })(this, function () {
  function creer(defs) {
    return { phase: "closed", winner: null, excluded: [], round: 0, deadline: 0, last: null,
      teams: defs.map(function (d) { return { n: d.n, c: d.c, score: 0 }; }) };
  }
  // retourne true si l'etat a change
  function appliquer(S, a, P, now) {
    P = P || {};
    switch (a.type) {
      case "open":
        S.phase = "open"; S.winner = null; S.excluded = []; S.round++; S.deadline = 0; S.last = null; return true;
      case "buzz":
        if (S.phase !== "open" || !S.teams[a.team] || S.excluded.indexOf(a.team) >= 0) return false;
        S.phase = "locked"; S.winner = a.team; S.last = null;
        S.deadline = P.reponse > 0 ? now + P.reponse * 1000 : 0; return true;
      case "good":
        if (S.phase !== "locked") return false;
        S.teams[S.winner].score += (P.points || 1);
        S.last = { team: S.winner, res: "good" }; S.phase = "closed"; S.winner = null; S.deadline = 0; return true;
      case "bad":
        if (S.phase !== "locked") return false;
        S.last = { team: S.winner, res: "bad" };
        if (P.exclure !== false) { S.excluded.push(S.winner); S.phase = S.excluded.length < S.teams.length ? "open" : "closed"; }
        else S.phase = "open";
        S.winner = null; S.deadline = 0; return true;
      case "cancel":
        if (S.phase === "closed") return false;
        S.phase = "closed"; S.winner = null; S.deadline = 0; return true;
      case "score":
        if (!S.teams[a.team]) return false;
        S.teams[a.team].score += (a.delta | 0); return true;
      case "resetScores":
        S.teams.forEach(function (t) { t.score = 0; }); return true;
      case "teams":
        S.teams = a.list.map(function (d, i) { return { n: d.n, c: d.c, score: S.teams[i] ? S.teams[i].score : 0 }; });
        if (S.winner !== null && !S.teams[S.winner]) { S.winner = null; S.phase = "closed"; S.deadline = 0; }
        S.excluded = S.excluded.filter(function (i) { return i < S.teams.length; });
        if (S.last && !S.teams[S.last.team]) S.last = null;
        return true;
    }
    return false;
  }
  return { creer: creer, appliquer: appliquer };
});

  }
  function buzzer(i){
    if(i===null||i===undefined) return;
    var S=Eq.S; if(!S||S.phase!=="open"||S.excluded.indexOf(i)>=0) return;
    agir({type:"buzz",team:i});
  }
  function clavierEquipes(e){
    if(Eq.role==="team"){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); buzzer(Eq.team); } return; }
    var k=e.key;
    if(k===" "||k==="Enter"){ e.preventDefault(); agir({type:"open"}); }
    else if(k==="g"||k==="G") agir({type:"good"});
    else if(k==="m"||k==="M") agir({type:"bad"});
    else if(Eq.role==="local"&&/^[1-8]$/.test(k)) buzzer(+k-1);
  }
  $("g_open").addEventListener("click",function(){ agir({type:"open"}); });
  $("g_good").addEventListener("click",function(){ agir({type:"good"}); });
  $("g_bad").addEventListener("click",function(){ agir({type:"bad"}); });
  $("g_cancel").addEventListener("click",function(){ agir({type:"cancel"}); });
  $("chg").addEventListener("click",function(){ Eq.team=null; try{ sessionStorage.removeItem("buzgen_team"); }catch(e){} connecter(); rendreEq(); });
  window.addEventListener("resize",function(){ var z=$("eqZones"); if(z) z.dataset.k=""; if(Eq.S) rendreEq(); });

  /* ----- reglages : mode et equipes ----- */
  function remplirMode(){
    var t=L(), box=$("modes"); box.innerHTML="";
    [["jury","mode_jury"],["local","mode_local"],["reseau","mode_reseau"]].forEach(function(m){
      var d=document.createElement("div"); d.className="mode"+(cfg.mode===m[0]?" sel":"");
      d.innerHTML="<b>"+t[m[1]]+"</b><small>"+t[m[1]+"_d"]+"</small>";
      d.addEventListener("click",function(){
        if(cfg.mode===m[0]) return; cfg.mode=m[0]; sauver(); demarrerMode(); appliquer(); remplir();
      });
      box.appendChild(d);
    });
    var ni=$("netInfo");
    if(cfg.mode==="reseau"){
      if(Eq.dispo&&Eq.info) ni.textContent=t.net_ok+" "+t.net_teams+" "+(Eq.info.urls.join("   ")||"—");
      else ni.textContent=t.net_need;
    } else ni.textContent="";
  }
  function remplirEquipes(){
    $("i_nbeq").value=String(cfg.nbEq); $("i_pts").value=cfg.points; $("i_rep").value=cfg.reponse; $("i_excl").checked=cfg.exclure!==false;
    var box=$("eqRows"); box.innerHTML="";
    for(var i=0;i<cfg.nbEq;i++){ (function(i){
      var r=document.createElement("div"); r.className="eqrow";
      var c=document.createElement("input"); c.type="color"; c.value=cfg.teams[i].c;
      var n=document.createElement("input"); n.type="text"; n.maxLength=24; n.value=cfg.teams[i].n; n.placeholder=L().eq+" "+(i+1);
      c.addEventListener("input",function(){ cfg.teams[i].c=c.value; majEquipes(); });
      n.addEventListener("input",function(){ cfg.teams[i].n=n.value; majEquipes(); });
      r.appendChild(c); r.appendChild(n); box.appendChild(r);
    })(i); }
  }
  function majEquipes(){
    sauver();
    if(Eq.S&&Eq.role==="local") Moteur.appliquer(Eq.S,{type:"teams",list:teamDefs()},params(),Date.now());
    if(Eq.role==="host") Moteur.appliquer(Eq.S,{type:"teams",list:teamDefs()},params(),Date.now());
    rendreEq(); pousserConfig();
  }
  $("i_nbeq").addEventListener("change",function(){ cfg.nbEq=+this.value; sauver(); majEquipes(); remplirEquipes(); });
  $("i_pts").addEventListener("input",function(){ cfg.points=this.value.replace(/\D/g,""); sauver(); pousserConfig(); });
  $("i_rep").addEventListener("input",function(){ cfg.reponse=this.value.replace(/\D/g,""); sauver(); pousserConfig(); });
  $("i_excl").addEventListener("change",function(){ cfg.exclure=this.checked; sauver(); pousserConfig(); });

  /* ---------- demarrage ---------- */
  charger();
  var prem=premier();
  if(/[?&]r=equipe/.test(location.search)){ Eq.role="team"; prem=false; }
  // langue du navigateur au tout premier lancement
  if(prem){ var nl=(navigator.language||"fr").slice(0,2); if(T[nl]) cfg.lang=nl; }
  appliquer();
  if(Eq.role==="team") demarrerEquipe(); else { if(prem) ouvrir(true); demarrerMode(); }
})();
</script>
</body>
</html>
